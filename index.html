<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Text Summarizer</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="container">

    <h1>🤖 AI Text Summarizer</h1>
    <p class="subtitle">
        Paste your text below and generate an AI-powered summary instantly.
    </p>

    <div class="card">

        <label>Select Summary Style</label>
        <div class="tone-buttons">
            <button class="tone-btn active" data-tone="simple">
                🟢 Simple
            </button>
            <button class="tone-btn" data-tone="professional">
                🔵 Professional
            </button>
            <button class="tone-btn" data-tone="bullet">
                🟣 Bullet Points
            </button>
            <button class="tone-btn" data-tone="student">
                🟠 Student Notes
            </button>
        </div>

        <label>Enter Text</label>
        <textarea
            id="inputText"
            placeholder="Paste your paragraph here..."
        ></textarea>

        <div class="info">
            <span id="charCount">0 Characters</span>
        </div>

        <button id="summarizeBtn">
            ✨ Summarize
        </button>

    </div>

    <div class="card resultCard">

        <div class="resultHeader">
            <h2>Summary</h2>

            <button id="copyBtn">
                📋 Copy
            </button>
        </div>

        <div id="loading" class="hidden">
            <div class="loader"></div>
            <p>Generating summary...</p>
        </div>

        <textarea
            id="outputText"
            placeholder="Your AI summary will appear here..."
            readonly
        ></textarea>
        <div class="info">
            <span id="summaryCharCount">0 Characters</span>
        </div>

        <button id="clearBtn">
            🗑 Clear
        </button>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
